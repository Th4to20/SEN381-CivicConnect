# Offline fallback profile for RSK-001 (cloud cold-start / quota exhaustion).
# Usage: POSTGRES_PASSWORD=<local-only value> docker compose -f docs/deployment/docker-compose.yml up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: civicconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: civicconnect
    ports: ['5432:5432']
    volumes: [civicconnect_pg:/var/lib/postgresql/data]
volumes:
  civicconnect_pg:
